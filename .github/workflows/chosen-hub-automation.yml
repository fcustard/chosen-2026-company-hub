name: CHOSEN Hub Automation

"on":
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "templates/**"
      - "tools/**"
      - "resources/**"
      - "app.js"
      - "*.html"
      - "styles.css"
      - "personalization-v1.css"
      - "company-personalization.css"
      - "company-personalization.js"
      - "package.json"
      - ".github/workflows/chosen-hub-automation.yml"

  workflow_dispatch:

  repository_dispatch:
    types:
      - publish-script

  schedule:
    # GitHub cron uses UTC. This is the fastest supported schedule cadence.
    # Offset from :00 to reduce the chance of high-load schedule delay.
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: chosen-hub-automation
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SCRIPT_DOC_FEED_URL: ${{ secrets.SCRIPT_DOC_FEED_URL }}

    steps:
      - name: Check out CHOSEN Hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Master Script feed for direct script publish
        if: ${{ github.event_name == 'repository_dispatch' && env.SCRIPT_DOC_FEED_URL == '' }}
        run: |
          echo "::error::SCRIPT_DOC_FEED_URL secret is missing. Add the Google Doc script feed URL before using direct script publishing."
          exit 1

      - name: Sync script scenes from Master Script document
        if: ${{ env.SCRIPT_DOC_FEED_URL != '' }}
        run: node tools/sync-script-doc.mjs

      - name: Skip script sync when Master Script feed is not configured
        if: ${{ env.SCRIPT_DOC_FEED_URL == '' && github.event_name != 'repository_dispatch' }}
        run: echo "SCRIPT_DOC_FEED_URL is not configured. Skipping script scene sync and continuing with existing script files."

      - name: Sync exact rehearsal calls from Master Calendar
        id: calendar_sync
        timeout-minutes: 3
        env:
          CALENDAR_FEED_URL: ${{ vars.CALENDAR_FEED_URL }}
        run: node tools/sync-exact-calls.mjs

      - name: Report rejected Master Calendar feed
        if: ${{ failure() && steps.calendar_sync.outcome == 'failure' }}
        run: |
          echo "::error title=CHOSEN Hub calendar update stopped::The feed=hub-v2 response was rejected. Existing rehearsal data was preserved, and no stale-data publish was allowed."
          {
            echo "## Master Calendar feed rejected"
            echo
            echo "The \`feed=hub-v2\` endpoint returned HTML, invalid JSON, an HTTP error, or data that failed schema validation."
            echo
            echo "- The existing \`data/rehearsals.json\` file was preserved."
            echo "- The build and publish steps were stopped."
            echo "- Review the **Sync exact rehearsal calls from Master Calendar** log for the precise response error."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Sync company people and assignments from Admin Master Sheets
        env:
          COMPANY_FEED_URL: ${{ vars.COMPANY_FEED_URL }}
        run: |
          set +e
          node tools/sync-company.mjs
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::warning::Company sync failed. Continuing with existing data/company.json so Master Calendar and script changes can still publish."

            if [ ! -s data/company.json ]; then
              echo "::error::data/company.json is missing or empty, so the Hub cannot safely continue."
              exit "$status"
            fi
          fi

      - name: Validate exact personalized calls
        run: node tools/validate-exact-personalization.mjs

      - name: Validate publication integrity and upcoming schedule
        run: node tools/validate-publication-integrity.mjs

      - name: Validate production data, scenes, and resources
        run: npm run validate

      - name: Build scene readers, resources, and Hub content
        run: npm run build

      - name: Publish generated website files
        run: |
          git config user.name "CHOSEN Hub Automation"
          git config user.email "actions@users.noreply.github.com"

          git pull --rebase --autostash origin main

          git add data/rehearsals.json || true
          git add data/company.json || true
          git add company.json || true
          git add data/content.json || true
          git add data/scripts.json || true
          git add data/scenes/scene-*.json || true
          git add content.json || true
          git add scene-*.html || true
          git add resources.html || true

          if git diff --cached --quiet; then
            echo "No generated Hub changes."
            exit 0
          fi

          git commit -m "Automated Hub content update"
          git push origin HEAD:main
