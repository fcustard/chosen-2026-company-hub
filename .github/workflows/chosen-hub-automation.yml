name: CHOSEN Hub Automation

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "templates/**"
      - "tools/**"
      - "package.json"
      - ".github/workflows/chosen-hub-automation.yml"

  workflow_dispatch:

  schedule:
    # Keep the Company Hub reasonably current throughout the day.
    # GitHub cron uses UTC.
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: chosen-hub-automation
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out CHOSEN Hub
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync exact rehearsal calls from Master Calendar
        env:
          CALENDAR_FEED_URL: ${{ vars.CALENDAR_FEED_URL }}
        run: node tools/sync-exact-calls.mjs

      - name: Sync company people and assignments from Admin Master Sheets
        env:
          COMPANY_FEED_URL: ${{ vars.COMPANY_FEED_URL }}
        run: node tools/sync-company.mjs

      - name: Validate production data and scene publication
        run: npm run validate

      - name: Build scene readers and Hub content
        run: npm run build

      - name: Publish generated website files
        run: |
          if git diff --quiet; then
            echo "No generated Hub changes."
            exit 0
          fi

          git config user.name "CHOSEN Hub Automation"
          git config user.email "actions@users.noreply.github.com"

          git add data/rehearsals.json
          git add data/company.json
          git add content.json
          git add scene-*.html

          git commit -m "Automated Hub content update"
          git push
