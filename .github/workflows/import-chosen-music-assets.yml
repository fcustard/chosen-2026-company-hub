name: Import CHOSEN music assets

on:
  push:
    paths:
      - ".github/workflows/import-chosen-music-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-chosen-music-assets
  cancel-in-progress: false

jobs:
  import-music:
    runs-on: ubuntu-latest

    steps:
      - name: Check out CHOSEN Hub
        uses: actions/checkout@v4

      - name: Download and validate approved rehearsal tracks
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p assets/audio

          download_track() {
            local file_id="$1"
            local output="$2"
            local expected_size="$3"

            curl               --fail               --location               --retry 3               --retry-delay 2               --output "$output"               "https://drive.usercontent.google.com/download?id=${file_id}&export=download&confirm=t"

            actual_size="$(wc -c < "$output" | tr -d ' ')"
            mime_type="$(file --brief --mime-type "$output")"

            if [[ "$actual_size" != "$expected_size" ]]; then
              echo "::error::Unexpected size for $output: expected $expected_size bytes, received $actual_size."
              exit 1
            fi

            if [[ "$mime_type" != audio/* ]]; then
              echo "::error::$output is not audio. Received MIME type: $mime_type"
              exit 1
            fi

            echo "Validated $output ($actual_size bytes; $mime_type)"
          }

          download_track             "1PVbEMUPENMAUHJw26VyhIxe_K1HkaT4I"             "assets/audio/01-welcome-to-nazareth-rehearsal-v1.mp3"             "7976718"

          download_track             "1SBylb4IVEFIoVQvBXtksT8KthYhBYIlZ"             "assets/audio/09-what-will-he-be-rehearsal-v1.mp3"             "2933781"

          sha256sum assets/audio/*.mp3

      - name: Publish verified audio assets
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "CHOSEN Hub Automation"
          git config user.email "actions@users.noreply.github.com"

          git add             assets/audio/01-welcome-to-nazareth-rehearsal-v1.mp3             assets/audio/09-what-will-he-be-rehearsal-v1.mp3

          if git diff --cached --quiet; then
            echo "Audio assets already match the approved Drive files."
            exit 0
          fi

          git commit -m "Host approved CHOSEN rehearsal tracks"
          git push
