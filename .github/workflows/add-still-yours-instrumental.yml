name: One-time Still Yours Instrumental Patch

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-still-yours-instrumental.yml"
      - ".tmp/still-yours/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Scene 8 instrumental
        shell: bash
        run: |
          mkdir -p assets/audio
          cat .tmp/still-yours/part-*.b64 | tr -d '\r\n' | base64 -d > assets/audio/08_Still_Yours_Instrumental_Rehearsal_v1.mp3
          test -s assets/audio/08_Still_Yours_Instrumental_Rehearsal_v1.mp3
          file assets/audio/08_Still_Yours_Instrumental_Rehearsal_v1.mp3

      - name: Add Music-page source records
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          music_path = Path("data/music.json")
          music = json.loads(music_path.read_text())
          title = "Still Yours (Instrumental)"
          entry = {
              "title": title,
              "scenes": [8],
              "type": "Instrumental rehearsal",
              "status": "Current rehearsal track",
              "approved": True,
              "companyPublish": True,
              "playUrl": "assets/audio/08_Still_Yours_Instrumental_Rehearsal_v1.mp3",
              "lyricsUrl": "#"
          }

          existing = next((i for i, x in enumerate(music) if x.get("title") == title), None)
          if existing is None:
              vocal = next((i for i, x in enumerate(music) if x.get("title") == "Still Yours"), len(music)-1)
              music.insert(vocal + 1, entry)
          else:
              music[existing] = entry
          music_path.write_text(json.dumps(music, indent=2, ensure_ascii=False) + "\n")

          lyrics_path = Path("data/lyrics.json")
          lyrics = json.loads(lyrics_path.read_text())
          lyrics["still-yours-instrumental"] = {
              "availability": "instrumental",
              "label": "Practice lyrics",
              "note": "This track is instrumental. These are the lyrics for the vocal version of “Still Yours.”",
              "reuse": "still-yours"
          }
          lyrics_path.write_text(json.dumps(lyrics, indent=2, ensure_ascii=False) + "\n")
          PY

      - name: Validate changed files
        run: |
          python3 -m json.tool data/music.json >/dev/null
          python3 -m json.tool data/lyrics.json >/dev/null
          test -s assets/audio/08_Still_Yours_Instrumental_Rehearsal_v1.mp3

      - name: Commit published track
        shell: bash
        run: |
          git config user.name "CHOSEN Hub Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/music.json data/lyrics.json assets/audio/08_Still_Yours_Instrumental_Rehearsal_v1.mp3
          if git diff --cached --quiet; then
            echo "Track already published."
            exit 0
          fi
          git commit -m "Publish Scene 8 Still Yours instrumental [skip calendar]"
          git push origin HEAD:main
